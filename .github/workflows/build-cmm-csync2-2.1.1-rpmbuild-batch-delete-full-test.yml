name: 03 - CMM batch delete rpmbuild Csync2 2.1.1 Full Test + MariaDB

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: ['almalinux/9-init', 'almalinux/8-init']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    - name: Set OS variables
      run: |
        if [[ '${{ matrix.os }}' == 'almalinux/8-init' ]]; then
          echo "DISTTAG=el8" >> $GITHUB_ENV
          echo "OS_VERSION=8" >> $GITHUB_ENV
        else
          echo "DISTTAG=el9" >> $GITHUB_ENV
          echo "OS_VERSION=9" >> $GITHUB_ENV
        fi

    - name: Build RPMs in container
      run: |
        mkdir -p ${{ github.workspace }}/rpms
        docker pull ${{ matrix.os }}
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ${{ matrix.os }} /bin/bash -c "
          dnf install -y --skip-broken \
                  initscripts \
                  systemd-sysv \
                  systemd-devel \
                  hostname \
                  systemd \
                  dos2unix \
                  curl \
                  python3 \
                  iptables \
                  iproute \
                  kmod \
                  procps-ng \
                  sudo \
                  udev --allowerasing

          systemctl unmask \
                  systemd-remount-fs.service \
                  dev-hugepages.mount \
                  sys-fs-fuse-connections.mount \
                  systemd-logind.service \
                  getty.target \
                  console-getty.service

          echo 'ReadKMsg=no' >> /etc/systemd/journald.conf
          
          # Copy and run build script
          cp /workspace/build-cmm-csync2-2.1.1-rpmbuild-batch-delete.sh /tmp
          chmod +x /tmp/build-cmm-csync2-2.1.1-rpmbuild-batch-delete.sh
          /tmp/build-cmm-csync2-2.1.1-rpmbuild-batch-delete.sh \${DISTTAG}

          # Copy RPMs to workspace
          mkdir -p /workspace/rpms
          cp /root/rpmbuild/RPMS/x86_64/*.rpm /workspace/rpms/
          cp /root/rpmbuild/SRPMS/*.rpm /workspace/rpms/
          cp /root/rpmbuild/SPECS/csync2.spec /workspace/rpms/
          
          echo
          ls -lah /workspace/rpms/
        "

    - name: Create Docker Compose test setup
      run: |
        cat > ${{ github.workspace }}/docker-compose-test.yml <<EOF
        version: '3.8'
        
        networks:
          csync2-test:
            driver: bridge
            ipam:
              config:
                - subnet: 10.10.10.0/24
        
        services:
          host1:
            image: ${{ matrix.os }}
            hostname: host1
            container_name: csync2-host1
            privileged: true
            networks:
              csync2-test:
                ipv4_address: 10.10.10.2
            volumes:
              - ./rpms:/rpms:ro
              - ./test-scripts:/scripts:ro
              - shared-csync2-testdir:/home/csync2-testdir
              - /sys/fs/cgroup:/sys/fs/cgroup:rw
            command: /usr/sbin/init
            environment:
              - container=docker
              - SYSTEMD_OFFLINE=0
            tmpfs:
              - /run
              - /run/lock
              - /tmp
            stop_signal: SIGRTMIN+3
            cap_add:
              - SYS_ADMIN
              - SYS_NICE
              - SYS_RESOURCE
            security_opt:
              - seccomp:unconfined
              - apparmor:unconfined
            
          host2:
            image: ${{ matrix.os }}
            hostname: host2
            container_name: csync2-host2
            privileged: true
            networks:
              csync2-test:
                ipv4_address: 10.10.10.3
            volumes:
              - ./rpms:/rpms:ro
              - ./test-scripts:/scripts:ro
              - shared-csync2-testdir2:/home/csync2-testdir
              - /sys/fs/cgroup:/sys/fs/cgroup:rw
            command: /usr/sbin/init
            environment:
              - container=docker
              - SYSTEMD_OFFLINE=0
            tmpfs:
              - /run
              - /run/lock
              - /tmp
            stop_signal: SIGRTMIN+3
            cap_add:
              - SYS_ADMIN
              - SYS_NICE
              - SYS_RESOURCE
            security_opt:
              - seccomp:unconfined
              - apparmor:unconfined
            depends_on:
              - host1
        
        volumes:
          shared-csync2-testdir:
          shared-csync2-testdir2:
        EOF

    - name: Create test scripts
      run: |
        mkdir -p ${{ github.workspace }}/test-scripts
        
        # Create setup script
        cat > ${{ github.workspace }}/test-scripts/setup-csync2.sh <<'SETUPEOF'
        #!/bin/bash
        set -e
        
        HOSTNAME=$1
        OTHER_HOST=$2
        OTHER_IP=$3
        SKIP_INSTALL=$4
        
        echo "Setting up csync2 on ${HOSTNAME}..."
        
        # Only install if not skipped
        if [ "$SKIP_INSTALL" != "skip_install" ]; then
          # Determine DISTTAG based on OS release
          if grep -q "release 8" /etc/redhat-release; then
              DISTTAG='el8'
              CRB_REPO="powertools"
          elif grep -q "release 9" /etc/redhat-release; then
              DISTTAG='el9'
              CRB_REPO="crb"
          fi
          
          # Install dependencies
          dnf clean all
          dnf install -y epel-release --quiet
          dnf config-manager --set-enabled "${CRB_REPO}"
          
          # Install all required dependencies for csync2
          dnf install -y \
              sqlite \
              sqlite-devel \
              librsync \
              librsync-devel \
              inotify-tools \
              iputils \
              iproute \
              hostname \
              gnutls \
              libgcrypt \
              openssl \
              net-tools \
              nmap-ncat --quiet
          
          # Find and install csync2 RPM
          RPM_FILE=$(ls /rpms/csync2-2.1.1-*.x86_64.rpm 2>/dev/null | grep -v debuginfo | head -n1)
          if [ -z "$RPM_FILE" ]; then
            echo "Error: csync2 RPM not found in /rpms/"
            ls -la /rpms/
            exit 1
          fi
          echo "Installing: $RPM_FILE"
          rpm -ivh "$RPM_FILE" || rpm -Uvh "$RPM_FILE"
        fi
        
        # Add hosts to /etc/hosts (avoid duplicates)
        grep -q "10.10.10.2 host1" /etc/hosts || echo "10.10.10.2 host1" >> /etc/hosts
        grep -q "10.10.10.3 host2" /etc/hosts || echo "10.10.10.3 host2" >> /etc/hosts
        
        # Create test directory
        mkdir -p /home/csync2-testdir
        
        # Generate csync2 key (only on host1 if not skipped)
        if [ "$HOSTNAME" = "host1" ] && [ "$SKIP_INSTALL" != "skip_install" ]; then
          csync2 -k /etc/csync2/csync2.key
          chmod 600 /etc/csync2/csync2.key
        fi
        
        # Generate SSL certificate and key for encrypted connections
        echo "Generating SSL certificate for ${HOSTNAME}..."
        openssl req -new -newkey rsa:2048 -days 3650 -nodes -x509 \
          -subj "/C=US/ST=State/L=City/O=CSyncTest/CN=${HOSTNAME}" \
          -keyout /etc/csync2/csync2_ssl_key.pem \
          -out /etc/csync2/csync2_ssl_cert.pem
        chmod 600 /etc/csync2/csync2_ssl_key.pem
        chmod 644 /etc/csync2/csync2_ssl_cert.pem
        
        # Create csync2 config
        cat > /etc/csync2/csync2.cfg <<CFGEOF
        group testgroup {
            host host1;
            host host2;
            
            key /etc/csync2/csync2.key;
            
            include /home/csync2-testdir;
            
            auto younger;
            
            # batch_delete_limit 20000;
        }
        CFGEOF
        
        # Start csync2 socket or daemon
        if command -v systemctl &> /dev/null && systemctl list-units &> /dev/null; then
          echo "Using systemd to start csync2..."
          systemctl daemon-reload
          systemctl start csync2.socket
          systemctl enable csync2.socket
        else
          echo "Systemd not available, using inotify_csync.sh approach..."
          
          # Pre-daemon startup debug info
          echo "=== Pre-daemon startup debug info ==="
          echo "Hostname: ${HOSTNAME}"
          echo "csync2 version:"
          /usr/sbin/csync2 -v || true
          echo ""
          
          # Validate config and SSL files
          echo "=== Configuration validation ==="
          if [ -f /etc/csync2/csync2.cfg ]; then
            echo "✓ Config file exists"
            chmod 644 /etc/csync2/csync2.cfg
          else
            echo "✗ Config file missing!"
            ls -la /etc/csync2/
          fi
          
          if [ -f /etc/csync2/csync2_ssl_cert.pem ] && [ -f /etc/csync2/csync2_ssl_key.pem ]; then
            echo "✓ SSL certificates exist"
          else
            echo "✗ SSL certificates missing!"
            ls -la /etc/csync2/*.pem 2>/dev/null || true
          fi
          
          if [ -f /etc/csync2/csync2.key ]; then
            echo "✓ Key file exists"
          else
            echo "✗ Key file missing!"
          fi
          echo ""
          
          # Setup inotify_csync.sh
          echo "=== Setting up inotify_csync.sh ==="
          
          # First, check what's actually in the RPM
          echo "Checking RPM contents for inotify_csync.sh location:"
          rpm -ql csync2 | grep inotify_csync.sh || echo "Not found via rpm -ql"
          
          # List all doc directories to debug
          echo "Doc directories present:"
          ls -la /usr/share/doc/ | grep csync2 || echo "No csync2 doc dirs found"
          
          # Check multiple possible locations
          INOTIFY_SCRIPT=""
          if [ -f /usr/share/doc/csync2/inotify_csync.sh ]; then
            INOTIFY_SCRIPT="/usr/share/doc/csync2/inotify_csync.sh"
            echo "✓ Found at /usr/share/doc/csync2/inotify_csync.sh"
          elif [ -f /usr/share/doc/csync2-2.1.1/inotify_csync.sh ]; then
            INOTIFY_SCRIPT="/usr/share/doc/csync2-2.1.1/inotify_csync.sh"
            echo "✓ Found at /usr/share/doc/csync2-2.1.1/inotify_csync.sh"
          else
            # Check with wildcard for any version
            FOUND_SCRIPT=$(ls /usr/share/doc/csync2*/inotify_csync.sh 2>/dev/null | head -1)
            if [ -n "$FOUND_SCRIPT" ]; then
              INOTIFY_SCRIPT="$FOUND_SCRIPT"
              echo "✓ Found at $FOUND_SCRIPT"
            fi
          fi
          
          # Use the found script or create minimal fallback
          if [ -n "$INOTIFY_SCRIPT" ]; then
            echo "Copying inotify_csync.sh from RPM installation..."
            cp "$INOTIFY_SCRIPT" /usr/local/bin/inotify_csync
            chmod +x /usr/local/bin/inotify_csync
            echo "✓ Successfully installed inotify_csync.sh"
          else
            echo "⚠ inotify_csync.sh not found in RPM installation"
            echo "Creating minimal daemon wrapper as fallback..."
            
            # Use echo instead of here-document to avoid YAML issues
            echo '#!/bin/bash' > /usr/local/bin/inotify_csync
            echo '# Minimal csync2 daemon wrapper for testing' >> /usr/local/bin/inotify_csync
            echo 'HOSTNAME="${2:-$(hostname)}"' >> /usr/local/bin/inotify_csync
            echo 'echo "Starting csync2 daemon for ${HOSTNAME}..."' >> /usr/local/bin/inotify_csync
            echo 'exec /usr/sbin/csync2 -ii -vvv -N ${HOSTNAME}' >> /usr/local/bin/inotify_csync
            chmod +x /usr/local/bin/inotify_csync
            echo "✓ Created minimal fallback wrapper"
          fi
          
          # Verify the script exists and is executable
          if [ -x /usr/local/bin/inotify_csync ]; then
            echo "✓ inotify_csync is ready at /usr/local/bin/inotify_csync"
            # Show first few lines to verify it's the right script
            echo "Script type: $(head -2 /usr/local/bin/inotify_csync | tail -1)"
          else
            echo "✗ Failed to setup inotify_csync!"
            exit 1
          fi
          
          # Create required directories
          mkdir -p /home/csync2-inotify/tmp
          chmod 755 /home/csync2-inotify
          
          # Ensure sync directory exists
          mkdir -p /home/csync2-testdir
          
          echo "Configuration file contents:"
          cat /etc/csync2/csync2.cfg
          echo ""
          
          # Create systemd service for inotify_csync
          echo "=== Creating inotify_csync.service ==="
          cat > /etc/systemd/system/inotify_csync.service <<SVCEOF
          [Unit]
          Description=Inotify Csync2 Sync Service
          After=network.target
          
          [Service]
          Type=simple
          # Pre-start script to kill any running csync2 processes
          ExecStartPre=/bin/bash -c 'pgrep -f csync2 && killall csync2 || true'
          # Start the csync2 service
          ExecStart=/usr/local/bin/inotify_csync -N ${HOSTNAME}
          Restart=on-failure
          RestartSec=5
          User=root
          WorkingDirectory=/home/csync2-inotify
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target
          SVCEOF
          
          # Enable and start the service
          echo "=== Starting inotify_csync service ==="
          systemctl daemon-reload
          systemctl enable inotify_csync.service
          systemctl start inotify_csync.service
          
          # Wait for service to start
          sleep 3
          
          # Check service status
          echo "=== Service status ==="
          systemctl status inotify_csync.service --no-pager -l || true
          
          # Check logs
          echo "=== Service logs ==="
          journalctl -u inotify_csync.service --no-pager | tail -25
          
          # Give daemon time to start and check multiple ways
          sleep 3
          
          echo "=== Post-startup verification ==="
          
          # Check for running processes
          echo "Process check:"
          if systemctl is-active inotify_csync.service > /dev/null 2>&1; then
            echo "✓ inotify_csync service is active"
            ps aux | grep inotify_csync | grep -v grep || true
            ps aux | grep "csync2.*-ii" | grep -v grep || true
          else
            echo "✗ inotify_csync service is NOT active"
            echo "Checking service status:"
            systemctl status inotify_csync.service --no-pager -l
            echo "Service logs:"
            journalctl -u inotify_csync.service --no-pager | tail -50
            echo "csync server log:"
            cat /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server log"
          fi
          
          echo ""
          echo "Port check:"
          if netstat -tln | grep -q 30865; then
            echo "✓ csync2 is listening on port 30865"
            netstat -tlnp | grep 30865 || true
          else
            echo "✗ csync2 is NOT listening on port 30865"
            echo "All listening ports:"
            netstat -tln
          fi
          
          echo ""
          echo "Connection test to localhost:"
          nc -zv localhost 30865 || echo "Cannot connect to port 30865"
          
          echo ""
          echo "inotify_csync directories check:"
          ls -la /home/csync2-inotify/ 2>/dev/null || echo "No inotify directory"
          ls -la /home/csync2-inotify/tmp/ 2>/dev/null || echo "No inotify tmp directory"
        fi
        
        echo "Setup complete on ${HOSTNAME}"
        SETUPEOF
        
        # Create sync test script
        cat > ${{ github.workspace }}/test-scripts/test-sync.sh <<'TESTEOF'
        #!/bin/bash
        set -e
        
        echo "=== Starting csync2 sync tests ==="
        
        # Pre-sync debug information
        echo "=== Pre-sync debug information ==="
        echo "Current hostname: $(hostname)"
        echo "Database files:"
        ls -la /var/lib/csync2/*.db* 2>/dev/null || echo "No database files found"
        echo "Configuration check:"
        csync2 -T || echo "Configuration test failed"
        
        # Test 1: Basic file sync
        echo "Test 1: Creating test file on host1..."
        echo "Hello from host1" > /home/csync2-testdir/test1.txt
        echo "Running sync with maximum verbosity..."
        csync2 -xvvvr /home/csync2-testdir || true
        sleep 2
        
        # Test 2: Multiple files
        echo "Test 2: Creating multiple files..."
        for i in {1..10}; do
          echo "File $i content" > /home/csync2-testdir/file$i.txt
        done
        echo "Running sync with maximum verbosity..."
        csync2 -xvvvr /home/csync2-testdir || true
        sleep 2
        
        # Test 3: File modification
        echo "Test 3: Modifying file..."
        echo "Modified content" >> /home/csync2-testdir/test1.txt
        echo "Running sync with maximum verbosity..."
        csync2 -xvvvr /home/csync2-testdir || true
        sleep 2
        
        # Test 4: File deletion
        echo "Test 4: Deleting file..."
        rm -f /home/csync2-testdir/file5.txt
        echo "Running sync with maximum verbosity..."
        csync2 -xvvvr /home/csync2-testdir || true
        sleep 2
        
        # Test 5: Batch delete limit test
        echo "Test 5: Testing batch delete limit..."
        for i in {1..100}; do
          echo "Batch test $i" > /home/csync2-testdir/batch$i.txt
        done
        echo "Running sync with maximum verbosity..."
        csync2 -xvvvbr /home/csync2-testdir || true
        sleep 3
        echo "Deleting all batch files..."
        rm -f /home/csync2-testdir/batch*.txt
        echo "Running sync after batch delete..."
        csync2 -xvvvbr /home/csync2-testdir || true
        sleep 3
        
        echo "=== Sync tests completed ==="
        
        # Final debug information
        echo "=== Post-sync debug information ==="
        echo "Database dirty entries:"
        csync2 -M || echo "No dirty entries or command failed"
        echo "Database hint entries:"
        csync2 -H || echo "No hint entries or command failed"
        TESTEOF
        
        # Create verification script
        cat > ${{ github.workspace }}/test-scripts/verify-sync.sh <<'VERIFYEOF'
        #!/bin/bash
        set -e
        
        echo "=== Verifying sync on host2 ==="
        
        # Check if test files exist
        ERRORS=0
        
        # Test 1 verification
        if [ -f /home/csync2-testdir/test1.txt ]; then
          echo "✓ Test 1: test1.txt exists"
          content=$(cat /home/csync2-testdir/test1.txt)
          if [[ "$content" == *"Modified content"* ]]; then
            echo "✓ Test 3: File modification synced"
          else
            echo "✗ Test 3: File modification NOT synced"
            ((ERRORS++))
          fi
        else
          echo "✗ Test 1: test1.txt missing"
          ((ERRORS++))
        fi
        
        # Test 2 verification
        file_count=$(ls -1 /home/csync2-testdir/file*.txt 2>/dev/null | wc -l)
        if [ "$file_count" -eq 9 ]; then
          echo "✓ Test 2 & 4: Correct number of files (9, file5.txt deleted)"
        else
          echo "✗ Test 2 & 4: Expected 9 files, found $file_count"
          ((ERRORS++))
        fi
        
        # Test 5 verification
        batch_count=$(ls -1 /home/csync2-testdir/batch*.txt 2>/dev/null | wc -l)
        if [ "$batch_count" -eq 0 ]; then
          echo "✓ Test 5: Batch files deleted successfully"
        else
          echo "✗ Test 5: Found $batch_count batch files, expected 0"
          ((ERRORS++))
        fi
        
        echo
        echo "=== Verification Results ==="
        if [ "$ERRORS" -eq 0 ]; then
          echo "SUCCESS: All tests passed!"
          exit 0
        else
          echo "FAILURE: $ERRORS test(s) failed"
          ls -la /home/csync2-testdir/
          exit 1
        fi
        VERIFYEOF
        
        chmod +x ${{ github.workspace }}/test-scripts/*.sh

        # ---- Dedent generated files (Option 2) ----
        # Remove exactly 8 leading spaces from each generated file so inner heredoc closers
        # like SVCEOF / SETUPEOF / TESTEOF / VERIFYEOF land at column 1 in the generated files.
        # If your YAML indentation differs, change the number of spaces after ^ accordingly.
        sed -i 's/^        //' ${{ github.workspace }}/test-scripts/*.sh ${{ github.workspace }}/docker-compose-test.yml || true

        # Quick verification: print lines that are exactly the heredoc closing tokens at start-of-line
        # (you should see lines like "SVCEOF" or "SETUPEOF" with no leading spaces)
        grep -n -E '^(SVCEOF|SETUPEOF|TESTEOF|VERIFYEOF|EOF)$' ${{ github.workspace }}/test-scripts/* ${{ github.workspace }}/docker-compose-test.yml || true

    - name: Start Docker Compose environment
      run: |
        cd ${{ github.workspace }}
        docker-compose -f docker-compose-test.yml up -d
        
        # Give containers a moment to start
        sleep 5
        
        # Check container status immediately
        echo "=== Initial container status ==="
        docker ps -a
        
        # Check if containers are actually running
        CONTAINERS_RUNNING=true
        if ! docker ps --format "table {{.Names}}" | grep -q csync2-host1; then
          echo "WARNING: csync2-host1 is not running"
          echo "=== csync2-host1 container logs ==="
          docker logs csync2-host1 2>&1 || true
          CONTAINERS_RUNNING=false
        fi
        
        if ! docker ps --format "table {{.Names}}" | grep -q csync2-host2; then
          echo "WARNING: csync2-host2 is not running"
          echo "=== csync2-host2 container logs ==="
          docker logs csync2-host2 2>&1 || true
          CONTAINERS_RUNNING=false
        fi
        
        # If containers failed with systemd, restart without systemd
        if [ "$CONTAINERS_RUNNING" = "false" ]; then
          echo "=== Containers failed to start with systemd, trying alternative approach ==="
          
          # Stop and remove failed containers
          docker-compose -f docker-compose-test.yml down || true
          
          # Create network if it doesn't exist
          docker network create --subnet=10.10.10.0/24 csync2-test-net 2>/dev/null || true
          
          # Create shared directories for volume mounting
          mkdir -p ${{ github.workspace }}/shared-testdir
          mkdir -p ${{ github.workspace }}/shared-testdir2
          
          # Start containers with sleep instead of systemd
          echo "Starting containers without systemd..."
          docker run -d --name csync2-host1 \
            --hostname host1 \
            --network csync2-test-net \
            --ip 10.10.10.2 \
            -v ${{ github.workspace }}/rpms:/rpms:ro \
            -v ${{ github.workspace }}/test-scripts:/scripts:ro \
            -v ${{ github.workspace }}/shared-testdir:/home/csync2-testdir \
            ${{ matrix.os }} \
            sleep infinity
            
          docker run -d --name csync2-host2 \
            --hostname host2 \
            --network csync2-test-net \
            --ip 10.10.10.3 \
            -v ${{ github.workspace }}/rpms:/rpms:ro \
            -v ${{ github.workspace }}/test-scripts:/scripts:ro \
            -v ${{ github.workspace }}/shared-testdir2:/home/csync2-testdir \
            ${{ matrix.os }} \
            sleep infinity
          
          echo "=== Containers restarted without systemd ==="
          docker ps -a
          
          # Set flag for non-systemd mode
          echo "SYSTEMD_MODE=false" >> $GITHUB_ENV
        else
          echo "Containers are running with systemd"
          echo "SYSTEMD_MODE=true" >> $GITHUB_ENV
          
          # Wait for systemd to be ready
          echo "Waiting for systemd to initialize..."
          
          # Wait for host1 systemd to be ready (reduced timeout)
          for i in {1..30}; do
            if docker exec csync2-host1 systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; then
              echo "host1 systemd is ready"
              break
            fi
            echo "Waiting for host1 systemd... ($i/30)"
            sleep 2
          done
          
          # Wait for host2 systemd to be ready (reduced timeout)
          for i in {1..30}; do
            if docker exec csync2-host2 systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; then
              echo "host2 systemd is ready"
              break
            fi
            echo "Waiting for host2 systemd... ($i/30)"
            sleep 2
          done
        fi
        
        # Ensure containers are still running
        echo "=== Final container check ==="
        docker ps
        
        # Install basic networking tools in containers
        echo "Installing network utilities..."
        docker exec csync2-host1 dnf install -y iputils iproute hostname nmap-ncat --quiet || true
        docker exec csync2-host2 dnf install -y iputils iproute hostname nmap-ncat --quiet || true
        
        # Check network connectivity
        echo "Testing network connectivity..."
        docker exec csync2-host1 ping -c 2 10.10.10.3 || echo "Note: ping to host2 failed"
        docker exec csync2-host2 ping -c 2 10.10.10.2 || echo "Note: ping to host1 failed"
        
        # Alternative connectivity test using IP addresses
        echo "Verifying container IP addresses..."
        docker exec csync2-host1 hostname -I
        docker exec csync2-host2 hostname -I

    - name: Setup csync2 on both hosts
      run: |
        # Find the exact RPM filename
        RPM_FILE=$(ls ${{ github.workspace }}/rpms/csync2-2.1.1-*.x86_64.rpm | head -n1)
        echo "Using RPM: ${RPM_FILE}"
        
        # Setup host1 first (this generates the key)
        echo "Setting up host1..."
        docker exec csync2-host1 bash /scripts/setup-csync2.sh host1 host2 10.10.10.3
        
        # Pre-setup host2 to create directories and install csync2
        echo "Pre-setup host2 (installing dependencies and csync2)..."
        docker exec csync2-host2 bash -c "
          # Install dependencies
          if grep -q 'release 8' /etc/redhat-release; then
            CRB_REPO='powertools'
          else
            CRB_REPO='crb'
          fi
          dnf clean all
          dnf install -y epel-release --quiet
          dnf config-manager --set-enabled \"\${CRB_REPO}\"
          
          # Install all csync2 dependencies and debugging tools
          dnf install -y sqlite sqlite-devel librsync librsync-devel \
                        inotify-tools hostname iputils iproute \
                        gnutls libgcrypt openssl net-tools nmap-ncat \
                        strace socat --quiet
          
          # Install csync2 RPM
          RPM_FILE=\$(ls /rpms/csync2-2.1.1-*.x86_64.rpm 2>/dev/null | grep -v debuginfo | head -n1)
          if [ -z \"\$RPM_FILE\" ]; then
            echo 'Error: csync2 RPM not found'
            ls -la /rpms/
            exit 1
          fi
          echo \"Installing: \$RPM_FILE\"
          rpm -ivh \"\$RPM_FILE\" || rpm -Uvh \"\$RPM_FILE\"
          
          # Ensure directory exists
          mkdir -p /etc/csync2
          mkdir -p /home/csync2-testdir
        "
        
        # Copy key from host1 to host2
        echo "Copying csync2 key to host2..."
        docker exec csync2-host1 cat /etc/csync2/csync2.key > /tmp/csync2.key
        docker cp /tmp/csync2.key csync2-host2:/etc/csync2/csync2.key
        docker exec csync2-host2 chmod 600 /etc/csync2/csync2.key
        
        # Complete setup on host2
        echo "Completing setup on host2..."
        docker exec csync2-host2 bash /scripts/setup-csync2.sh host2 host1 10.10.10.2 skip_install
        
        # Verify csync2 is running with comprehensive debug
        echo "=== Checking csync2 status on both hosts ==="
        if [ "$SYSTEMD_MODE" = "true" ]; then
          docker exec csync2-host1 systemctl status csync2.socket --no-pager || true
          docker exec csync2-host2 systemctl status csync2.socket --no-pager || true
        else
          echo "=== Host1 debug information ==="
          echo "Host1 csync2 process:"
          docker exec csync2-host1 ps aux | grep csync2 | grep -v grep || echo "No csync2 process found on host1"
          echo "Host1 listening ports:"
          docker exec csync2-host1 netstat -tln | grep 30865 || echo "Port 30865 not listening on host1"
          echo "Host1 service logs (last 20 lines):"
          docker exec csync2-host1 journalctl -u inotify_csync.service --no-pager | tail -20 || echo "No service logs on host1"
          
          echo "=== Host2 debug information ==="
          echo "Host2 csync2 process:"
          docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 process found on host2"
          echo "Host2 listening ports:"
          docker exec csync2-host2 netstat -tln | grep 30865 || echo "Port 30865 not listening on host2"
          echo "Host2 service logs (last 20 lines):"
          docker exec csync2-host2 journalctl -u inotify_csync.service --no-pager | tail -20 || echo "No service logs on host2"
        fi
        
        # Test network connectivity
        echo "=== Testing network connectivity ==="
        echo "Host1 to Host2 connectivity:"
        docker exec csync2-host1 nc -zv host2 30865 || echo "Cannot connect from host1 to host2:30865"
        docker exec csync2-host1 nc -zv 10.10.10.3 30865 || echo "Cannot connect from host1 to 10.10.10.3:30865"
        
        echo "Host2 to Host1 connectivity:"
        docker exec csync2-host2 nc -zv host1 30865 || echo "Cannot connect from host2 to host1:30865"
        docker exec csync2-host2 nc -zv 10.10.10.2 30865 || echo "Cannot connect from host2 to 10.10.10.2:30865"
        
        # Test csync2 connectivity
        echo "=== Testing csync2 connectivity ==="
        docker exec csync2-host1 csync2 -T host2 || echo "Note: Initial connection test may fail until first sync"

    - name: Run sync tests
      run: |
        # Initialize databases on both hosts
        echo "Initializing csync2 databases..."
        docker exec csync2-host1 csync2 -cr /home/csync2-testdir || true
        docker exec csync2-host2 csync2 -cr /home/csync2-testdir || true
        
        # Run tests from host1
        echo "Starting synchronization tests..."
        if ! docker exec csync2-host1 bash /scripts/test-sync.sh; then
          echo "=== TESTS FAILED - Collecting debug information ==="
          
          echo "=== Service status on failure ==="
          echo "Host1 service status:"
          docker exec csync2-host1 systemctl is-active inotify_csync.service || echo "Service not active on host1"
          docker exec csync2-host1 ps aux | grep csync2 | grep -v grep || echo "No csync2 processes on host1"
          docker exec csync2-host1 netstat -tlnp | grep 30865 || echo "Port 30865 not listening on host1"
          
          echo "Host2 service status:"
          docker exec csync2-host2 systemctl is-active inotify_csync.service || echo "Service not active on host2"
          docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 processes on host2"
          docker exec csync2-host2 netstat -tlnp | grep 30865 || echo "Port 30865 not listening on host2"
          
          echo "=== inotify_csync service logs ==="
          echo "Host1 inotify_csync service:"
          docker exec csync2-host1 journalctl -u inotify_csync.service --no-pager | tail -50 || echo "No service logs on host1"
          
          echo "Host2 inotify_csync service:"
          docker exec csync2-host2 journalctl -u inotify_csync.service --no-pager | tail -50 || echo "No service logs on host2"
          
          echo "=== csync server logs (from inotify_csync) ==="
          echo "Host1 csync server log:"
          docker exec csync2-host1 cat /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server log on host1"
          
          echo "Host2 csync server log:"
          docker exec csync2-host2 cat /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server log on host2"
          
          echo "=== inotify queue logs ==="
          echo "Host1 inotify queue:"
          docker exec csync2-host1 cat /home/csync2-inotify/tmp/inotify_queue.log 2>/dev/null || echo "No queue log on host1"
          
          echo "Host2 inotify queue:"
          docker exec csync2-host2 cat /home/csync2-inotify/tmp/inotify_queue.log 2>/dev/null || echo "No queue log on host2"
          
          echo "=== Full service status ==="
          echo "Host1 service status:"
          docker exec csync2-host1 systemctl status inotify_csync.service --no-pager -l || echo "Service not running on host1"
          
          echo "Host2 service status:"
          docker exec csync2-host2 systemctl status inotify_csync.service --no-pager -l || echo "Service not running on host2"
          
          echo "=== Configuration files ==="
          echo "Host1 config:"
          docker exec csync2-host1 cat /etc/csync2/csync2.cfg || echo "No config on host1"
          
          echo "Host2 config:"
          docker exec csync2-host2 cat /etc/csync2/csync2.cfg || echo "No config on host2"
          
          echo "Tests completed with errors"
        fi
        
        # Give time for final sync
        echo "Waiting for final synchronization..."
        sleep 5
        
        # Force a final sync from host1
        echo "Running final sync..."
        docker exec csync2-host1 csync2 -xvvvr /home/csync2-testdir || true
        
        # Verify on host2
        echo "Verifying synchronization on host2..."
        docker exec csync2-host2 bash /scripts/verify-sync.sh

    - name: Collect test results and logs
      if: always()
      run: |
        echo "=== Host1 csync2 status ==="
        if [ "$SYSTEMD_MODE" = "true" ]; then
          docker exec csync2-host1 systemctl status csync2.socket --no-pager || true
        else
          echo "Processes:"
          docker exec csync2-host1 ps aux | grep csync2 | grep -v grep || echo "No csync2 process on host1"
          docker exec csync2-host1 ps aux | grep inotify | grep -v grep || echo "No inotify process on host1"
          echo "Logs (last 20 lines):"
          docker exec csync2-host1 tail -20 /tmp/inotify_csync.log 2>/dev/null || echo "No inotify log"
          docker exec csync2-host1 tail -20 /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server log"
        fi
        echo
        echo "=== Host2 csync2 status ==="
        if [ "$SYSTEMD_MODE" = "true" ]; then
          docker exec csync2-host2 systemctl status csync2.socket --no-pager || true
        else
          echo "Processes:"
          docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 process on host2"
          docker exec csync2-host2 ps aux | grep inotify | grep -v grep || echo "No inotify process on host2"
          echo "Logs (last 20 lines):"
          docker exec csync2-host2 tail -20 /tmp/inotify_csync.log 2>/dev/null || echo "No inotify log"
          docker exec csync2-host2 tail -20 /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server log"
        fi
        echo
        echo "=== Host1 directory contents ==="
        docker exec csync2-host1 ls -la /home/csync2-testdir/ || true
        echo
        echo "=== Host2 directory contents ==="
        docker exec csync2-host2 ls -la /home/csync2-testdir/ || true
        echo
        echo "=== Host1 csync2 database ==="
        docker exec csync2-host1 sqlite3 /var/lib/csync2/host1.db3 "SELECT COUNT(*) FROM file;" 2>/dev/null || echo "No database on host1"
        echo
        echo "=== Host2 csync2 database ==="
        docker exec csync2-host2 sqlite3 /var/lib/csync2/host2.db3 "SELECT COUNT(*) FROM file;" 2>/dev/null || echo "No database on host2"

    - name: Cleanup Docker Compose
      if: always()
      run: |
        cd ${{ github.workspace }}
        # Clean up docker-compose if it was used
        if [ -f docker-compose-test.yml ]; then
          docker-compose -f docker-compose-test.yml down -v || true
        fi
        # Clean up standalone containers if they exist
        docker rm -f csync2-host1 csync2-host2 2>/dev/null || true
        # Clean up custom network
        docker network rm csync2-test-net 2>/dev/null || true
        # Clean up shared directories
        rm -rf ${{ github.workspace }}/shared-testdir ${{ github.workspace }}/shared-testdir2 || true

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: csync2-test-results-${{ env.OS_VERSION }}
        path: |
          ${{ github.workspace }}/rpms/
          ${{ github.workspace }}/docker-compose-test.yml
          ${{ github.workspace }}/test-scripts/
        retention-days: 7