name: 03 - CMM batch delete rpmbuild Csync2 2.1.1 Full Test + MariaDB

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: ['almalinux/9-init', 'almalinux/8-init']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Sysbox
      run: |
        curl -LO https://downloads.nestybox.com/sysbox/releases/v0.6.7/sysbox-ce_0.6.7-0.linux_amd64.deb
        sudo dpkg -i sysbox-ce_0.6.7-0.linux_amd64.deb || sudo apt-get install -f

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    - name: Set OS variables
      run: |
        if [[ '${{ matrix.os }}' == 'almalinux/8-init' ]]; then
          echo "DISTTAG=el8" >> $GITHUB_ENV
          echo "OS_VERSION=8" >> $GITHUB_ENV
        else
          echo "DISTTAG=el9" >> $GITHUB_ENV
          echo "OS_VERSION=9" >> $GITHUB_ENV
        fi

    - name: Build RPMs in container
      run: |
        mkdir -p ${{ github.workspace }}/rpms
        docker pull ${{ matrix.os }}
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ${{ matrix.os }} /bin/bash -c "
          dnf install -y --skip-broken \
                  initscripts \
                  systemd-sysv \
                  systemd-devel \
                  hostname \
                  systemd \
                  dos2unix \
                  curl \
                  python3 \
                  iptables \
                  iproute \
                  kmod \
                  procps-ng \
                  sudo \
                  udev --allowerasing

          systemctl unmask \
                  systemd-remount-fs.service \
                  dev-hugepages.mount \
                  sys-fs-fuse-connections.mount \
                  systemd-logind.service \
                  getty.target \
                  console-getty.service

          echo 'ReadKMsg=no' >> /etc/systemd/journald.conf
          
          # Copy and run build script
          cp /workspace/build-cmm-csync2-2.1.1-rpmbuild-batch-delete.sh /tmp
          chmod +x /tmp/build-cmm-csync2-2.1.1-rpmbuild-batch-delete.sh
          /tmp/build-cmm-csync2-2.1.1-rpmbuild-batch-delete.sh \${DISTTAG}

          # Copy RPMs to workspace
          mkdir -p /workspace/rpms
          cp /root/rpmbuild/RPMS/x86_64/*.rpm /workspace/rpms/
          cp /root/rpmbuild/SRPMS/*.rpm /workspace/rpms/
          cp /root/rpmbuild/SPECS/csync2.spec /workspace/rpms/
          
          echo
          ls -lah /workspace/rpms/
        "

    - name: Create Docker Compose test setup
      run: |
        cat > ${{ github.workspace }}/docker-compose-test.yml <<EOF
        version: '3.8'
        
        networks:
          csync2-test:
            driver: bridge
            ipam:
              config:
                - subnet: 10.10.10.0/24
        
        services:
          host1:
            image: ${{ matrix.os }}
            hostname: host1
            container_name: csync2-host1
            runtime: sysbox-runc
            privileged: true
            networks:
              csync2-test:
                ipv4_address: 10.10.10.2
            volumes:
              - ./rpms:/rpms:ro
              - ./test-scripts:/scripts:ro
              - shared-csync2-testdir:/home/csync2-testdir
              - /sys/fs/cgroup:/sys/fs/cgroup:rw
            command: /usr/sbin/init
            environment:
              - container=docker
            tmpfs:
              - /run:noexec,nosuid,size=100m
              - /run/lock:noexec,nosuid,size=100m
              - /tmp:noexec,nosuid,size=100m
            stop_signal: SIGRTMIN+3
            cap_add:
              - SYS_ADMIN
              - SYS_NICE
              - SYS_RESOURCE
              - NET_ADMIN
            security_opt:
              - seccomp:unconfined
              - apparmor:unconfined
            restart: unless-stopped
            
          host2:
            image: ${{ matrix.os }}
            hostname: host2
            container_name: csync2-host2
            runtime: sysbox-runc
            privileged: true
            networks:
              csync2-test:
                ipv4_address: 10.10.10.3
            volumes:
              - ./rpms:/rpms:ro
              - ./test-scripts:/scripts:ro
              - shared-csync2-testdir2:/home/csync2-testdir
              - /sys/fs/cgroup:/sys/fs/cgroup:rw
            command: /usr/sbin/init
            environment:
              - container=docker
            tmpfs:
              - /run:noexec,nosuid,size=100m
              - /run/lock:noexec,nosuid,size=100m
              - /tmp:noexec,nosuid,size=100m
            stop_signal: SIGRTMIN+3
            cap_add:
              - SYS_ADMIN
              - SYS_NICE
              - SYS_RESOURCE
              - NET_ADMIN
            security_opt:
              - seccomp:unconfined
              - apparmor:unconfined
            restart: unless-stopped
        
        volumes:
          shared-csync2-testdir:
          shared-csync2-testdir2:
        EOF

    - name: Copy test scripts to workspace
      run: |
        # Scripts are already in the repository under test-scripts/
        # Just make sure they're executable
        chmod +x test-scripts/*.sh
        ls -la test-scripts/

    - name: Start Docker Compose environment
      run: |
        cd ${{ github.workspace }}
        
        # Update docker-compose to use sysbox runtime
        cat > ${{ github.workspace }}/docker-compose-test.yml <<EOF
        version: '3.8'
        
        networks:
          csync2-test:
            driver: bridge
            ipam:
              config:
                - subnet: 10.10.10.0/24
        
        services:
          host1:
            image: ${{ matrix.os }}
            hostname: host1
            container_name: csync2-host1
            runtime: sysbox-runc
            privileged: true
            networks:
              csync2-test:
                ipv4_address: 10.10.10.2
            volumes:
              - ./rpms:/rpms:ro
              - ./test-scripts:/scripts:ro
              - shared-csync2-testdir:/home/csync2-testdir
              - /sys/fs/cgroup:/sys/fs/cgroup:ro
              - /tmp/host1-run:/run
            command: /usr/sbin/init
            environment:
              - container=docker
            cap_add:
              - SYS_ADMIN
            security_opt:
              - seccomp:unconfined
              - label:disable
              - apparmor:unconfined
            
          host2:
            image: ${{ matrix.os }}
            hostname: host2
            container_name: csync2-host2
            runtime: sysbox-runc
            privileged: true
            networks:
              csync2-test:
                ipv4_address: 10.10.10.3
            volumes:
              - ./rpms:/rpms:ro
              - ./test-scripts:/scripts:ro
              - shared-csync2-testdir2:/home/csync2-testdir
              - /sys/fs/cgroup:/sys/fs/cgroup:ro
              - /tmp/host2-run:/run
            command: /usr/sbin/init
            environment:
              - container=docker
            cap_add:
              - SYS_ADMIN
            security_opt:
              - seccomp:unconfined
              - label:disable
              - apparmor:unconfined
        
        volumes:
          shared-csync2-testdir:
          shared-csync2-testdir2:
        EOF

        # Create temporary directories for /run mounts
        mkdir -p /tmp/host1-run /tmp/host2-run
        
        # Start containers with Sysbox
        docker-compose -f docker-compose-test.yml up -d
        
        # Wait for systemd to initialize
        echo "Waiting for systemd to initialize..."
        sleep 10
        
        # Check systemd status
        for i in {1..30}; do
          if docker exec csync2-host1 systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; then
            echo "host1 systemd is ready"
            break
          fi
          echo "Waiting for host1 systemd... ($i/30)"
          sleep 2
        done
        
        for i in {1..30}; do
          if docker exec csync2-host2 systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; then
            echo "host2 systemd is ready"
            break
          fi
          echo "Waiting for host2 systemd... ($i/30)"
          sleep 2
        done
        
        echo "SYSTEMD_MODE=true" >> $GITHUB_ENV
        
        # Install basic networking tools
        echo "Installing network utilities..."
        docker exec csync2-host1 dnf install -y iputils iproute hostname nmap-ncat --quiet
        docker exec csync2-host2 dnf install -y iputils iproute hostname nmap-ncat --quiet
        
        # Test network connectivity
        echo "Testing network connectivity..."
        docker exec csync2-host1 ping -c 2 10.10.10.3 || echo "Note: ping to host2 failed"
        docker exec csync2-host2 ping -c 2 10.10.10.2 || echo "Note: ping to host1 failed"
        
        # Alternative connectivity test using IP addresses
        echo "Verifying container IP addresses..."
        docker exec csync2-host1 hostname -I
        docker exec csync2-host2 hostname -I

    - name: Setup csync2 on host1
      run: |
        # Find the exact RPM filename
        RPM_FILE=$(ls ${{ github.workspace }}/rpms/csync2-2.1.1-*.x86_64.rpm | head -n1)
        echo "Using RPM: ${RPM_FILE}"
        
        # Setup host1 first (this generates the key)
        echo "Setting up host1..."
        docker exec csync2-host1 bash /scripts/setup-csync2.sh host1 host2 10.10.10.3

    - name: Install dependencies on host2
      run: |
        # Install dependencies on host2 first
        echo "Installing dependencies on host2..."
        docker exec csync2-host2 bash -c "
          if grep -q 'release 8' /etc/redhat-release; then
            CRB_REPO='powertools'
          else
            CRB_REPO='crb'
          fi
          dnf clean all
          dnf install -y epel-release --quiet
          dnf config-manager --set-enabled \"\${CRB_REPO}\"
          dnf install -y sqlite sqlite-devel librsync librsync-devel \
                        inotify-tools hostname iputils iproute \
                        gnutls libgcrypt openssl net-tools nmap-ncat \
                        strace socat --quiet
        "

    - name: Create directories on host2
      run: |
        # Create directories first
        echo "Creating directories on host2..."
        docker exec csync2-host2 mkdir -p /etc/csync2 /home/csync2-testdir /var/lib/csync2
        docker exec csync2-host2 chmod 755 /etc/csync2 /home/csync2-testdir /var/lib/csync2
        
        # Verify directory creation
        echo "Verifying directory creation..."
        docker exec csync2-host2 test -d /etc/csync2 && echo "✓ /etc/csync2 exists" || {
          echo "✗ /etc/csync2 creation failed"
          docker exec csync2-host2 ls -la /etc/ | head -20
          exit 1
        }
        docker exec csync2-host2 test -d /home/csync2-testdir && echo "✓ /home/csync2-testdir exists" || {
          echo "✗ /home/csync2-testdir creation failed"
          exit 1
        }

    - name: Install csync2 RPM on host2
      run: |
        # Install csync2 RPM
        echo "Installing csync2 RPM on host2..."
        docker exec csync2-host2 bash -c "
          RPM_FILE=\$(ls /rpms/csync2-2.1.1-*.x86_64.rpm 2>/dev/null | grep -v debuginfo | head -n1)
          if [ -z \"\$RPM_FILE\" ]; then
            echo 'Error: csync2 RPM not found'
            ls -la /rpms/
            exit 1
          fi
          echo \"Installing: \$RPM_FILE\"
          rpm -ivh \"\$RPM_FILE\" || rpm -Uvh \"\$RPM_FILE\"
          
          # Verify installation
          rpm -qi csync2 || echo 'csync2 package query failed'
          which csync2 || echo 'csync2 binary not in PATH'
        "

    - name: Copy csync2 key to host2
      run: |
        # Copy key from host1 to host2 with comprehensive verification
        echo "Copying csync2 key to host2..."
        
        # Verify host1 key exists
        echo "Checking host1 key..."
        if ! docker exec csync2-host1 test -f /etc/csync2/csync2.key; then
          echo "Error: Key not found on host1"
          docker exec csync2-host1 ls -la /etc/csync2/ || echo "Directory doesn't exist on host1"
          exit 1
        fi
        echo "✓ Host1 key verified"
        
        # Verify host2 directory exists
        echo "Verifying host2 directory..."
        if ! docker exec csync2-host2 test -d /etc/csync2; then
          echo "Error: /etc/csync2 doesn't exist on host2"
          docker exec csync2-host2 ls -la /etc/ | head -10
          exit 1
        fi
        echo "✓ Host2 directory confirmed"
        
        # Extract and copy key
        echo "Extracting key from host1..."
        docker exec csync2-host1 cat /etc/csync2/csync2.key > /tmp/csync2.key
        
        # Verify temp file
        if [ ! -s /tmp/csync2.key ]; then
          echo "Error: Failed to extract key from host1"
          exit 1
        fi
        echo "✓ Key extracted ($(wc -c < /tmp/csync2.key) bytes)"
        
        # Copy to host2
        echo "Copying key to host2..."
        docker exec -i csync2-host2 bash -c 'cat > /etc/csync2/csync2.key' < /tmp/csync2.key
        
        # Verify copy succeeded
        if docker exec csync2-host2 test -f /etc/csync2/csync2.key; then
          docker exec csync2-host2 chmod 600 /etc/csync2/csync2.key
          docker exec csync2-host2 chown root:root /etc/csync2/csync2.key
          echo "✓ Key copied and permissions set"
        else
          echo "Error: Key copy failed"
          docker exec csync2-host2 ls -la /etc/csync2/ || echo "Directory not accessible"
          exit 1
        fi
        
        # Extract and copy SSL certificates
        echo "Extracting SSL certificates from host1..."
        docker exec csync2-host1 cat /etc/csync2/csync2_ssl_cert.pem > /tmp/csync2_ssl_cert.pem
        docker exec csync2-host1 cat /etc/csync2/csync2_ssl_key.pem > /tmp/csync2_ssl_key.pem
        
        echo "✓ SSL cert extracted ($(wc -c < /tmp/csync2_ssl_cert.pem) bytes)"
        echo "✓ SSL key extracted ($(wc -c < /tmp/csync2_ssl_key.pem) bytes)"
        
        echo "Copying SSL certificates to host2..."
        docker exec -i csync2-host2 bash -c 'cat > /etc/csync2/csync2_ssl_cert.pem' < /tmp/csync2_ssl_cert.pem
        docker exec -i csync2-host2 bash -c 'cat > /etc/csync2/csync2_ssl_key.pem' < /tmp/csync2_ssl_key.pem
        
        # Set correct permissions
        docker exec csync2-host2 chmod 644 /etc/csync2/csync2_ssl_cert.pem
        docker exec csync2-host2 chmod 600 /etc/csync2/csync2_ssl_key.pem
        echo "✓ SSL certificates copied and permissions set"
        
        # Clean up
        rm -f /tmp/csync2.key /tmp/csync2_ssl_cert.pem /tmp/csync2_ssl_key.pem

    - name: Complete csync2 setup on host2
      run: |
        # Complete setup on host2
        echo "Completing setup on host2..."
        docker exec csync2-host2 bash /scripts/setup-csync2.sh host2 host1 10.10.10.2 skip_install

    - name: Verify csync2 setup
      continue-on-error: true
      run: |
        # Verify csync2 is running with comprehensive debug
        echo "=== Checking csync2 status on both hosts ==="
        if [ "$SYSTEMD_MODE" = "true" ]; then
          docker exec csync2-host1 systemctl status csync2.socket --no-pager || true
          docker exec csync2-host2 systemctl status csync2.socket --no-pager || true
        else
          echo "=== Host1 debug information ==="
          echo "Host1 csync2 process:"
          docker exec csync2-host1 ps aux | grep csync2 | grep -v grep || echo "No csync2 process found on host1"
          echo "Host1 listening ports:"
          docker exec csync2-host1 netstat -tln | grep 30865 || echo "Port 30865 not listening on host1"
          echo "Host1 daemon logs (full):"
          docker exec csync2-host1 cat /tmp/csync2_daemon.log 2>/dev/null || echo "No daemon logs on host1"
          echo "Host1 daemon PID check:"
          docker exec csync2-host1 bash -c 'if [ -f /tmp/csync2_daemon.pid ]; then PID=$(cat /tmp/csync2_daemon.pid); if kill -0 $PID 2>/dev/null; then echo "Daemon PID $PID is running"; else echo "Daemon PID $PID is NOT running"; fi; fi'
          
          echo "=== Host2 debug information ==="
          echo "Host2 csync2 process:"
          docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 process found on host2"
          echo "Host2 listening ports:"
          docker exec csync2-host2 netstat -tln | grep 30865 || echo "Port 30865 not listening on host2"
          echo "Host2 daemon logs (full):"
          docker exec csync2-host2 cat /tmp/csync2_daemon.log 2>/dev/null || echo "No daemon logs on host2"
          echo "Host2 daemon PID check:"
          docker exec csync2-host2 bash -c 'if [ -f /tmp/csync2_daemon.pid ]; then PID=$(cat /tmp/csync2_daemon.pid); if kill -0 $PID 2>/dev/null; then echo "Daemon PID $PID is running"; else echo "Daemon PID $PID is NOT running"; fi; fi'
        fi
        
        # Test network connectivity
        echo "=== Testing network connectivity ==="
        echo "Host1 to Host2 connectivity:"
        docker exec csync2-host1 nc -zv host2 30865 || echo "Cannot connect from host1 to host2:30865"
        docker exec csync2-host1 nc -zv 10.10.10.3 30865 || echo "Cannot connect from host1 to 10.10.10.3:30865"
        
        echo "Host2 to Host1 connectivity:"
        docker exec csync2-host2 nc -zv host1 30865 || echo "Cannot connect from host2 to host1:30865"
        docker exec csync2-host2 nc -zv 10.10.10.2 30865 || echo "Cannot connect from host2 to 10.10.10.2:30865"
        
        # Test csync2 connectivity
        echo "=== Testing csync2 connectivity ==="
        docker exec csync2-host1 csync2 -T host2 || echo "Note: Initial connection test may fail until first sync"
        
        # Manual CONFIG test
        echo "=== Testing CONFIG command manually ==="
        echo "Sending CONFIG to host2 from host1:"
        docker exec csync2-host1 bash -c 'echo -e "CONFIG \n" | nc -w 2 host2 30865' || echo "CONFIG test failed"
        echo "Checking daemon status after CONFIG test:"
        docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 process after CONFIG"
        echo "Host2 daemon log after CONFIG:"
        docker exec csync2-host2 cat /tmp/csync2_daemon.log 2>/dev/null | tail -30 || echo "No log"

    - name: Run sync tests
      run: |
        # Initialize databases on both hosts
        echo "Initializing csync2 databases..."
        docker exec csync2-host1 csync2 -cr /home/csync2-testdir || true
        docker exec csync2-host2 csync2 -cr /home/csync2-testdir || true
        
        # Run tests from host1
        echo "Starting synchronization tests..."
        if ! docker exec csync2-host1 bash /scripts/test-sync.sh; then
          echo "=== TESTS FAILED - Collecting debug information ==="
          
          echo "=== Service status on failure ==="
          echo "Host1 daemon status:"
          docker exec csync2-host1 ps aux | grep "csync2 -ii" | grep -v grep || echo "Daemon not running on host1"
          docker exec csync2-host1 ps aux | grep csync2 | grep -v grep || echo "No csync2 processes on host1"
          docker exec csync2-host1 netstat -tlnp | grep 30865 || echo "Port 30865 not listening on host1"
          
          echo "Host2 daemon status:"
          docker exec csync2-host2 ps aux | grep "csync2 -ii" | grep -v grep || echo "Daemon not running on host2"
          docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 processes on host2"
          docker exec csync2-host2 netstat -tlnp | grep 30865 || echo "Port 30865 not listening on host2"
          
          echo "=== csync2 daemon logs ==="
          echo "Host1 csync2 daemon (full log):"
          docker exec csync2-host1 cat /tmp/csync2_daemon.log 2>/dev/null || echo "No daemon logs on host1"
          
          echo "Host2 csync2 daemon (full log):"
          docker exec csync2-host2 cat /tmp/csync2_daemon.log 2>/dev/null || echo "No daemon logs on host2"
          
          echo "=== csync server logs ==="
          echo "Host1 csync server log:"
          docker exec csync2-host1 cat /tmp/csync2_daemon.log 2>/dev/null || docker exec csync2-host1 cat /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server logs found on host1"
          
          echo "Host2 csync server log:"
          docker exec csync2-host2 cat /tmp/csync2_daemon.log 2>/dev/null || docker exec csync2-host2 cat /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server logs found on host2"
          
          echo "=== inotify queue logs ==="
          echo "Host1 inotify queue:"
          docker exec csync2-host1 cat /home/csync2-inotify/tmp/inotify_queue.log 2>/dev/null || echo "No queue log on host1"
          
          echo "Host2 inotify queue:"
          docker exec csync2-host2 cat /home/csync2-inotify/tmp/inotify_queue.log 2>/dev/null || echo "No queue log on host2"
          
          echo "=== Full daemon status ==="
          echo "Host1 daemon status:"
          docker exec csync2-host1 ps aux | grep csync2 | grep -v grep || echo "No csync2 processes on host1"
          echo "Host1 daemon log (full):"
          docker exec csync2-host1 cat /tmp/csync2_daemon.log 2>/dev/null || echo "No daemon log on host1"
          
          echo "Host2 daemon status:"
          docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 processes on host2"
          echo "Host2 daemon log (full):"
          docker exec csync2-host2 cat /tmp/csync2_daemon.log 2>/dev/null || echo "No daemon log on host2"
          
          echo "=== Configuration files ==="
          echo "Host1 config:"
          docker exec csync2-host1 cat /etc/csync2/csync2.cfg || echo "No config on host1"
          
          echo "Host2 config:"
          docker exec csync2-host2 cat /etc/csync2/csync2.cfg || echo "No config on host2"
          
          echo "Tests completed with errors"
        fi
        
        # Give time for final sync
        echo "Waiting for final synchronization..."
        sleep 5
        
        # Force a final sync from host1
        echo "Running final sync..."
        docker exec csync2-host1 csync2 -xvvvr /home/csync2-testdir || true
        
        # Verify on host2
        echo "Verifying synchronization on host2..."
        docker exec csync2-host2 bash /scripts/verify-sync.sh

    - name: Collect test results and logs
      if: always()
      run: |
        echo "=== Host1 csync2 status ==="
        if [ "$SYSTEMD_MODE" = "true" ]; then
          docker exec csync2-host1 systemctl status csync2.socket --no-pager || true
        else
          echo "Processes:"
          docker exec csync2-host1 ps aux | grep csync2 | grep -v grep || echo "No csync2 process on host1"
          docker exec csync2-host1 ps aux | grep inotify | grep -v grep || echo "No inotify process on host1"
          echo "Logs (last 20 lines):"
          docker exec csync2-host1 tail -20 /tmp/inotify_csync.log 2>/dev/null || echo "No inotify log"
          docker exec csync2-host1 tail -20 /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server log"
        fi
        echo
        echo "=== Host2 csync2 status ==="
        if [ "$SYSTEMD_MODE" = "true" ]; then
          docker exec csync2-host2 systemctl status csync2.socket --no-pager || true
        else
          echo "Processes:"
          docker exec csync2-host2 ps aux | grep csync2 | grep -v grep || echo "No csync2 process on host2"
          docker exec csync2-host2 ps aux | grep inotify | grep -v grep || echo "No inotify process on host2"
          echo "Logs (last 20 lines):"
          docker exec csync2-host2 tail -20 /tmp/inotify_csync.log 2>/dev/null || echo "No inotify log"
          docker exec csync2-host2 tail -20 /home/csync2-inotify/tmp/csync_server.log 2>/dev/null || echo "No server log"
        fi
        echo
        echo "=== Host1 directory contents ==="
        docker exec csync2-host1 ls -la /home/csync2-testdir/ || true
        echo
        echo "=== Host2 directory contents ==="
        docker exec csync2-host2 ls -la /home/csync2-testdir/ || true
        echo
        echo "=== Host1 csync2 database ==="
        docker exec csync2-host1 sqlite3 /var/lib/csync2/host1.db3 "SELECT COUNT(*) FROM file;" 2>/dev/null || echo "No database on host1"
        echo
        echo "=== Host2 csync2 database ==="
        docker exec csync2-host2 sqlite3 /var/lib/csync2/host2.db3 "SELECT COUNT(*) FROM file;" 2>/dev/null || echo "No database on host2"

    - name: Cleanup Docker Compose
      if: always()
      run: |
        cd ${{ github.workspace }}
        # Clean up docker-compose if it was used
        if [ -f docker-compose-test.yml ]; then
          docker-compose -f docker-compose-test.yml down -v || true
        fi
        # Clean up standalone containers if they exist
        docker rm -f csync2-host1 csync2-host2 2>/dev/null || true
        # Clean up custom network
        docker network rm csync2-test-net 2>/dev/null || true
        # Clean up shared directories
        rm -rf ${{ github.workspace }}/shared-testdir ${{ github.workspace }}/shared-testdir2 || true

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: csync2-test-results-${{ env.OS_VERSION }}
        path: |
          ${{ github.workspace }}/rpms/
          ${{ github.workspace }}/docker-compose-test.yml
          ${{ github.workspace }}/test-scripts/
        retention-days: 7